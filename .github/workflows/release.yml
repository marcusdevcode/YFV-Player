name: Release

# Runs on version tags (v0.1.0, v0.1.1, ...). Free for public repositories.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, platform: macos-latest, args: "--target aarch64-apple-darwin", rust_target: aarch64-apple-darwin }
          - { name: macOS x64, platform: macos-latest, args: "--target x86_64-apple-darwin", rust_target: x86_64-apple-darwin }
          - { name: Linux x64, platform: ubuntu-22.04, args: "" }
          - { name: Linux arm64, platform: ubuntu-22.04-arm, args: "" }
          - { name: Windows x64, platform: windows-latest, args: "" }
          - { name: Windows arm64, platform: windows-11-arm, args: "--target aarch64-pc-windows-msvc", rust_target: aarch64-pc-windows-msvc }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Name and version come from package.json only.
      - name: Read app info from package.json
        id: app
        shell: bash
        run: |
          echo "name=$(node scripts/app-info.mjs name)" >> "$GITHUB_OUTPUT"
          echo "version=$(node scripts/app-info.mjs version)" >> "$GITHUB_OUTPUT"

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" != "v${{ steps.app.outputs.version }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match package.json version v${{ steps.app.outputs.version }}"
            exit 1
          fi

      - name: Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: node scripts/tauri.mjs
          tagName: v${{ steps.app.outputs.version }}
          releaseName: "${{ steps.app.outputs.name }} v${{ steps.app.outputs.version }}"
          releaseBody: "See the assets below to download ${{ steps.app.outputs.name }} for your system."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
