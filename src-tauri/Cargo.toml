[package]
name = "app"
version = "0.1.6"
description = "Video player"
authors = ["marcusdevcode"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
trash = "5"
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

# Development builds keep only line numbers (no full debug info) and none for the libraries: the
# target folder is several times smaller and builds faster. Panics still show file and line.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
